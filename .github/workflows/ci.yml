name: CI

on:
  push:
    branches: [main]
  pull_request:
    # `closed` tears the pull request's preview down.
    types: [opened, reopened, synchronize, closed]

# Concurrency is per job: a newer push cancels superseded checks, but a deploy
# or destroy always finishes, so Alchemy's state is never left mid-apply.

jobs:
  check:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    concurrency:
      group: check-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      # pnpm 12 ships a native executable that the Corepack bundled with
      # Node 24.11 cannot install. This action reads packageManager instead.
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm docs:build

  # Every push to main that passes the checks deploys the prod stage of
  # alchemy.run.ts: the server Worker and the docs site. Credentials are the
  # CI token that stacks/github.ts writes into the repository's secrets, with
  # the owner's bearer token (FAMILY_OS_TOKEN), bound to the Worker.
  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile
      - run: pnpm deploy:prod --yes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FAMILY_OS_TOKEN: ${{ secrets.FAMILY_OS_TOKEN }}

  # Each open pull request from this repository gets its own stage, pr-<number>,
  # redeployed on every push that passes the checks. alchemy.run.ts comments
  # its URLs on the pull request. Forks get no preview: they can't read secrets.
  preview:
    needs: check
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: preview-pr-${{ github.event.number }}
      cancel-in-progress: false
    steps:
      # The checks take a minute. If the pull request closed meanwhile, its
      # cleanup has already run, and deploying now would leave a preview behind.
      - name: Skip if the pull request is no longer open
        id: open
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state="$(gh api "repos/$GITHUB_REPOSITORY/pulls/${{ github.event.number }}" --jq .state)"
          echo "open=$([ "$state" = open ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.open.outputs.open == 'true'
        uses: actions/checkout@v7
      - if: steps.open.outputs.open == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - if: steps.open.outputs.open == 'true'
        uses: pnpm/action-setup@v6
      - if: steps.open.outputs.open == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.open.outputs.open == 'true'
        run: pnpm exec alchemy deploy --stage "pr-${{ github.event.number }}" --yes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FAMILY_OS_TOKEN: ${{ secrets.FAMILY_OS_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          PULL_REQUEST: ${{ github.event.number }}
          PREVIEW_SHA: ${{ github.event.pull_request.head.sha }}

  # Closing or merging a pull request destroys its preview stage.
  preview-cleanup:
    if: >-
      github.event_name == 'pull_request' && github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: preview-pr-${{ github.event.number }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile
      # Only ever destroy a pr-<number> stage, never prod.
      - run: |
          stage="pr-${{ github.event.number }}"
          case "$stage" in pr-[0-9]*) ;; *) echo "refusing to destroy '$stage'"; exit 1 ;; esac
          pnpm exec alchemy destroy --stage "$stage" --yes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FAMILY_OS_TOKEN: ${{ secrets.FAMILY_OS_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          PULL_REQUEST: ${{ github.event.number }}
